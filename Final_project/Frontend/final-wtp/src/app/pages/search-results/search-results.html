<div class="search-results-page">
  <app-search-navbar></app-search-navbar>

  <div class="search-results">
    <h2 class="results-title">Resultados para: <span>"Apple"</span></h2>

    <!-- Mientras carga -->
    <p *ngIf="cargando">Cargando productos...</p>

    <!-- Si hubo error -->
    <p *ngIf="error" style="color: red;">{{ error }}</p>

    <div class="products-grid">

      <!-- Recorre los productos del backend -->
      <div class="product-card" *ngFor="let product of products">
        <img [src]="product.imageUrl || 'images/iphone.png'" [alt]="product.name"/>
        <div class="card-info">
          <p class="product-name">{{ product.name }}</p>
          <p class="product-price">Q{{ product.prices[0]?.price }}</p>
          <p class="product-store">{{ product.prices[0]?.store }}</p>
        </div>
      </div>

    </div>

    <!-- Si no hay productos -->
    <p *ngIf="!cargando && products.length === 0">No hay productos todavía.</p>
  </div>
</div>
