<app-search-navbar></app-search-navbar>

<div class="page-container">
  <div class="profile-wrapper" *ngIf="user; else noUser">
    <section class="profile-card">
      <div class="profile-header">
        <div class="profile-badge">Perfil</div>
        <h1>Bienvenido, {{ user.name }}</h1> 
        <p class="subtitle">Aquí están los datos de tu cuenta registrada.</p>
      </div>

      <div class="profile-info">
        <div class="info-item">
          <span class="label">Nombre</span>
          <span class="value">{{ user.name }}</span>
        </div>

        <div class="info-item">
          <span class="label">Correo electrónico</span>
          <span class="value">{{ user.gmail }}</span> </div>

        <div class="info-item">
          <span class="label">Plan actual</span>
          <span class="value plan" [ngClass]="user.plan">{{ user.plan | uppercase }}</span>
        </div>
      </div>
      <div class="profile-actions">
        <button class="btn-main" (click)="logout()" routerLink="/login">
          Cerrar sesión
        </button>
      </div>
    </section>
  </div>

  <ng-template #noUser>
    <div class="empty-state">
      <section class="empty-card">
        <div class="empty-icon">!</div>
        <h2>No tienes un usuario activo</h2>
        <p>Inicia sesión para gestionar tu cuenta.</p>
        <button class="btn-main" routerLink="/register">Ir al Login</button>
      </section>
    </div>
  </ng-template>
</div>
