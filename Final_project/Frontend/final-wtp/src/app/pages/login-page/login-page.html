<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <span class="badge">Iniciar sesión</span>
      <h2>Bienvenido de nuevo</h2>
      <p>Ingresa tus datos para acceder a tu perfil de WTP.</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="name">Nombre de usuario</label>
        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="userData.name"
          placeholder="Ej. Dhidel Osorio"
          required
        />
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label> <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="userData.password" 
          placeholder="••••••••"
          required
        />
      </div>

      <div class="error-container" *ngIf="errorMessage">
        <p class="error-text">⚠️ {{ errorMessage }}</p>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="!loading">Entrar</span>
        <span *ngIf="loading">Validando...</span>
      </button>
    </form>

    <div class="login-footer">
      <span>¿Aún no tienes cuenta?</span>
      <a (click)="navigate('/register')">Crear una cuenta</a>
    </div>
  </div>
</div>
