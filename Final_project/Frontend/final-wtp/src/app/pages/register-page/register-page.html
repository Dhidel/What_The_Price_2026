<div class="register-page">
  <div class="register-card">
    <div class="register-header">
      <span class="badge">Crear cuenta</span>
      <h2>Regístrate</h2>
      <p>Completa tus datos para guardar tu perfil localmente.</p>
    </div>

    <form class="register-form" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="name">Nombre Completo</label>
        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="userData.name"
          placeholder="Ej. Dhidel Osorio"
          required
        />
      </div>

      <div class="input-group">
        <label for="plan">Plan</label>
        <select
          id="plan"
          name="plan"
          [(ngModel)]="userData.plan"
          required
        >
          <option value="basic">Básico</option>
          <option value="plus">Plus</option>
        </select>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="contrasena"
          [(ngModel)]="userData.contrasena"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="button" (click)="onSubmit()">Registrarse</button>
    </form>

    <div class="register-footer">
      <span>¿Ya tienes cuenta?</span>
      <a (click)="navigate('/login')">Ir al login</a> 
    </div>
  </div>
</div>
