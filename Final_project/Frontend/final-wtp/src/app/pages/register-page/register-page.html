<div class="register-page">
  <div class="register-card">
    <div class="register-header">
      <span class="badge">Crear cuenta</span>
      <h2>Únete a WTP</h2>
      <p>Crea tu perfil para comparar precios y guardar tus favoritos.</p>
    </div>

    <form class="register-form" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="name">Nombre Completo</label>
        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="userData.name"
          placeholder="Ej. Dhidel Osorio"
          required
        />
      </div>

      <div class="input-group">
        <label for="gmail">Correo Electrónico</label>
        <input
          id="gmail"
          type="email"
          name="gmail"
          [(ngModel)]="userData.gmail"
          placeholder="ejemplo@gmail.com"
          required
        />
      </div>

      <div class="input-group">
        <label for="plan">Plan de preferencia</label>
        <select
          id="plan"
          name="plan"
          [(ngModel)]="userData.plan"
          required
        >
          <option value="basic">Básico (Gratis)</option>
          <option value="plus">Plus (Premium)</option>
        </select>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="userData.password"
          placeholder="Mínimo 8 caracteres"
          required
        />
      </div>

      <button type="submit" class="btn-register" [disabled]="loading">
        {{ loading ? 'Creando cuenta...' : 'Registrarse' }}
      </button>
    </form>

    <div class="register-footer">
      <span>¿Ya tienes una cuenta?</span>
      <a (click)="navigate('/login')">Inicia sesión aquí</a> 
    </div>
  </div>
</div>
