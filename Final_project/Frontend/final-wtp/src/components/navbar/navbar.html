<header class="navbar">
  <div class="nav-left">
    <div class="hamburger" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <span class="nav-abreviado" (click)="navigate('/')">WTP</span>
  </div>

  <div class="nav-center">
    <h1 (click)="navigate('/')">What The Price</h1>
  </div>

  <div class="nav-actions">
    <ng-container *ngIf="currentUser; else noUser">
      <button class="icon-btn" (click)="navigate('/favorites-page')" aria-label="Favoritos" title="Favoritos">
        ♡
      </button>

      <button class="icon-btn profile-btn" (click)="navigate('/profile')" aria-label="Perfil" title="Perfil">
        👤 <span class="user-display-name">{{ currentUser.name }}</span>
      </button>
    </ng-container>

    <ng-template #noUser>
      <button class="btn-login-trigger" (click)="navigate('/register')">
        Log in / Sign up
      </button>
    </ng-template>
  </div>
</header>

<div class="overlay" *ngIf="isMenuOpen" (click)="closeAllMenus()"></div>

<div class="sidenav" [class.open]="isMenuOpen">
  <div class="sidenav-header">
    <span *ngIf="currentUser" class="welcome-msg">Hola, {{ currentUser.name }}</span>
    <span class="close-btn" (click)="toggleMenu()">&times;</span>
  </div>

  <nav class="sidenav-content">
    <ng-container *ngIf="currentUser">
      <a (click)="navigate('/favorites-page')">1) Mis Favoritos</a>
      <a (click)="navigate('/profile')">2) Mi Perfil</a>
    </ng-container>

    <a *ngIf="!currentUser" (click)="navigate('/register')">1) Iniciar Sesión / Registro</a>

    <a (click)="toggleAbout()">3) Sobre Nosotros</a>
    <div class="about-text" *ngIf="showAboutText">
      <p>Comparador de productos electrónicos líder en Guatemala.</p>
    </div>

    <a (click)="contactWhatsApp()">4) Servicio al cliente</a>
    
    <a *ngIf="currentUser" (click)="logout()" class="logout-link">5) Cerrar Sesión</a>
  </nav>
</div>
