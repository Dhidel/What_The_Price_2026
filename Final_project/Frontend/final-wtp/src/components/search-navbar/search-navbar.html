<header class="search-navbar">
  <div class="navbar-left">
    <div class="menu-icon" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <a class="navbar-logo" routerLink="/">WTP</a>
  </div>

  <div class="navbar-center">
    <div class="search-wrapper">
      <input class="search-input" type="text" placeholder="Search" />
      <button class="search-button" aria-label="Search">🔍</button>
    </div>
  </div>

  <div class="navbar-right">
    <ng-container *ngIf="currentUser; else guestActions">
      <button class="icon-btn" (click)="navigate('/favorites-page')" aria-label="Favoritos" title="Favoritos">
        ♡
      </button>

      <button class="icon-btn" (click)="navigate('/profile')" aria-label="Perfil" title="Perfil">
        👤
      </button>
    </ng-container>

    <ng-template #guestActions>
      <a routerLink="/login">Log in</a>
      <a routerLink="/register" class="signup-button">Sign up</a>
    </ng-template>
  </div>
</header>

<div class="sidenav" [class.open]="isMenuOpen">
  <div class="sidenav-header">
    <span class="close-btn" (click)="toggleMenu()">&times;</span>
  </div>

  <nav class="sidenav-content">
    <a (click)="navigate('/favorites-page')">1) Favoritos</a>
    <a (click)="navigate('/profile')">2) Perfil</a>
    <a (click)="toggleAbout()">3) Nosotros</a>

    <div class="about-text" *ngIf="showAboutText">
      <p>
        What the price es una página para comparar los productos electronicos entre las páginas más reconocidas del país, con el enfoque de eficientizar la vida de los Guatemaltecos al momento de realizar una compra.
      </p>
    </div>

    <a (click)="contactWhatsApp()">4) Servicio al cliente</a>
  </nav>
</div>

<div class="overlay" *ngIf="isMenuOpen" (click)="toggleMenu()"></div>
